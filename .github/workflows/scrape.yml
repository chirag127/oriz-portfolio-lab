name: scrape

on:
  schedule:
    - cron: '17 13 * * 1-5' # 13:17 UTC weekdays = ~18:47 IST, after NSE close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/scrape.mjs
      - name: Commit + push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/market.json
          git diff --cached --quiet || git commit -m "data: market levels $(date -u +%F)"
          git push
