# MegaLinter GitHub Action configuration
# Auto-fixes formatting and linting issues on every push and PR
name: MegaLinter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_FLAVOR: all
          APPLY_FIXES: all
          APPLY_FIXES_EVENT: push
          APPLY_FIXES_MODE: commit
          FORMATTERS_DISABLE_ERRORS: true
          # ts-standard can't resolve astro/tsconfigs/strict in container; biome handles TS linting
          TYPESCRIPT_STANDARD_DISABLE_ERRORS: true
          MARKDOWN_MARKDOWN_LINK_CHECK_DISABLE_ERRORS: true
          YAML_V8R_DISABLE_ERRORS: true
          SPELL_CSPELL_DISABLE_ERRORS: true
          SPELL_LYCHEE_DISABLE_ERRORS: true
          REPOSITORY_CHECKOV_DISABLE_ERRORS: true
          REPOSITORY_DEVSKIM_DISABLE_ERRORS: true
          REPOSITORY_GRYPE_DISABLE_ERRORS: true
          REPOSITORY_KICS_DISABLE_ERRORS: true
          REPOSITORY_TRIVY_DISABLE_ERRORS: true

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 7
